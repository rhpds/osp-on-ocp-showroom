---
# RHOSO 19.0 beta - single-repository mirror.
#
# Every image lives as a tag of one repository, quay.io/redhat_emp1/rhoso19_beta,
# so visibility and permissions are managed in one place instead of 88 repos.
# All sources therefore share the same mirror: CRI-O pulls by digest, and each
# digest is unique, so one repository can serve them all.
#
# Alternative layout (one repo per image): osp-ng-rhoso19-beta-idms.yaml
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: rhoso19-beta-quay
spec:
  imageDigestMirrors:
    - mirrors:
        - quay.io/redhat_emp1/rhoso19_beta
      source: registry.redhat.io/rhoso/openstack-aodh-api-rhel10

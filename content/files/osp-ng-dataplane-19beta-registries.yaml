# RHOSO 19.0 beta - registry mirrors for the EDPM (data plane) nodes.
#
# The cluster-wide ImageDigestMirrorSet only rewrites pulls made by CRI-O on the
# OpenShift nodes. EDPM nodes are RHEL hosts running podman, so they need their own
# mirror list. Merge this block into nodeTemplate.ansible.ansibleVars of your
# OpenStackDataPlaneNodeSet; edpm-ansible writes it to
# /etc/containers/registries.conf.d/20-edpm-podman-registries.conf.
#
# Repo names differ between registry.redhat.io and the quay mirror (no -rhel10
# suffix), so every image needs its own prefix block - a single prefix rewrite
# of registry.redhat.io/rhoso would resolve to names that do not exist.
edpm_podman_registries:
  - prefix: registry.redhat.io/rhoso/openstack-aodh-api-rhel10
    location: registry.redhat.io/rhoso/openstack-aodh-api-rhel10
    insecure: false
    mirrors:
      - location: quay.io/redhat_emp1/pnavarro-rhoso19-beta/openstack-aodh-api
        insecure: false

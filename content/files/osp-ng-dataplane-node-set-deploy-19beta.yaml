apiVersion: dataplane.openstack.org/v1beta1
kind: OpenStackDataPlaneNodeSet
metadata:
  name: openstack-edpm-compute-1
  namespace: openstack
spec:
  env:
    - name: ANSIBLE_FORCE_COLOR
      value: "True"
    - name: ANSIBLE_VERBOSITY
      value: "2"
  services:
    - download-cache
    - bootstrap
    - configure-network
    - validate-network
    - install-os
    - configure-os
    - ssh-known-hosts
    - run-os
    - reboot-os
    - install-certs
    - ovn
    - neutron-metadata
    - libvirt
    - nova
    - telemetry
  networkAttachments:
    - ctlplane
  preProvisioned: true
  nodes:
      edpm-compute-1:
        hostName: edpm-compute-1.sandbox-UUID-ocp4-cluster.svc.cluster.local
        ansible:
          ansibleHost: 172.22.0.100
          ansibleVars:
            fqdn_internal_api: edpm-compute-1.sandbox-UUID-ocp4-cluster.svc.cluster.local
        networks:
        - name: ctlplane
          subnetName: subnet1
          defaultRoute: false
          fixedIP: 172.22.0.100
        - name: internalapi
          subnetName: subnet1
          fixedIP: 172.17.0.100
        - name: storage
          subnetName: subnet1
          fixedIP: 172.18.0.100
        - name: tenant
          subnetName: subnet1
          fixedIP: 172.19.0.100
        - name: external
          subnetName: subnet1
          fixedIP: 172.21.0.100
  nodeTemplate:
    ansibleSSHPrivateKeySecret: dataplane-ansible-ssh-private-key-secret
    managementNetwork: ctlplane
    ansible:
      ansibleUser: cloud-user
      ansibleVarsFrom:
      - secretRef:
          name: subscription-manager
      - secretRef:
          name: redhat-registry
      ansibleVars:
         # The redhat service registers the host, nothing more.
         #
         # rhc_repositories is deliberately NOT set. subscription-manager leaves
         # rhsm.conf with manage_repos = 0 after registering, so it never writes
         # /etc/yum.repos.d/redhat.repo, and the role's "Configure repositories"
         # task then rejects every entry - including the "*" wildcard - with
         # "<id> is not a valid repository ID". The rhc role cannot fix this:
         # neither the role nor the redhat_subscription module it calls knows
         # about manage_repos (grep the collection, there are zero matches), and
         # the repository task runs immediately after registration, leaving no
         # window to flip it. Repositories are enabled from edpm_bootstrap_command
         # below instead, which runs later, in the bootstrap service.
         rhc_release: 10.2
         # OVS package name on RHEL 10 / fast-datapath.
         edpm_ovs_packages:
             - openvswitch3.5
         # Runs on the node during bootstrap, after the redhat service has
         # registered it and before anything installs a package or pulls an image.
         # Two jobs:
         #
         # 1. Repositories. Registration leaves manage_repos = 0, so turn it back
         #    on and enable the four repos by hand. These are the RHEL 10
         #    equivalents of what the 18.0 node set enables, minus rhoso-19.0:
         #    the beta RPM content is not on the CDN yet, the same reason the
         #    container images come from the quay mirror. Confirm the IDs with
         #    "subscription-manager repos --list" on the compute before editing.
         #
         # 2. Image signature policy. RHEL 10 ships /usr/share/containers/policy.json
         #    from containers-common, which demands a sigstore signature for
         #    registry.redhat.io. The policy is matched against the reference you
         #    ask for, not the mirror it is served from, so the unsigned pre-GA
         #    images fail with "A signature was required, but no signature exists".
         #    This writes root's own policy, keeping signature enforcement
         #    everywhere except the two pre-GA RHOSO namespaces (containers/image
         #    applies the most specific match). Drop it once the RHOSO 19.0 images
         #    are published and signed.
         edpm_bootstrap_command: >-
           subscription-manager config --rhsm.manage_repos=1 &&
           subscription-manager refresh &&
           subscription-manager repos
           --enable=rhel-10-for-x86_64-baseos-rpms
           --enable=rhel-10-for-x86_64-appstream-rpms
           --enable=rhceph-9-tools-for-rhel-10-x86_64-rpms
           --enable=fast-datapath-for-rhel-10-x86_64-rpms &&
           mkdir -p /root/.config/containers &&
           echo '{"default":[{"type":"insecureAcceptAnything"}],"transports":{"docker":{"registry.access.redhat.com":[{"type":"sigstoreSigned","keyPath":"/etc/pki/sigstore/SIGSTORE-redhat-release3","rekorPublicKeyPath":"/etc/pki/sigstore/REKOR-signing-key"}],"registry.redhat.io":[{"type":"sigstoreSigned","keyPath":"/etc/pki/sigstore/SIGSTORE-redhat-release3","rekorPublicKeyPath":"/etc/pki/sigstore/REKOR-signing-key"}],"registry.redhat.io/rhoso":[{"type":"insecureAcceptAnything"}],"registry.redhat.io/rhoso-operators":[{"type":"insecureAcceptAnything"}]},"docker-daemon":{"":[{"type":"insecureAcceptAnything"}]}}}'
           > /root/.config/containers/policy.json
         # Insights off: a throwaway lab host does not belong in the Insights
         # inventory. "remediation: absent" also skips the rhc / rhc-worker-playbook
         # install and the "Enable remediation" task, which fails on RHEL 10 with
         # "Could not find the requested service rhcd". The whole dict must be
         # given, the role reads rhc_insights as one value.
         rhc_insights:
           state: absent
           remediation: absent
         # nmstate instead of os-net-config: the os-net-config RPM lives in the
         # RHOSO repository, which does not exist for the 19.0 beta, so
         # download-cache fails with "No package os-net-config available". The
         # nmstate path uses linux-system-roles and RHEL 10 packages instead.
         # The template below is therefore in nmstate network_state format, not
         # the os-net-config format used by the 18.0 file: edpm_network_config
         # feeds it straight to fedora.linux_system_roles.network.
         edpm_network_config_tool: nmstate
         edpm_network_config_template: |
           ---
           {% set mtu_list = [ctlplane_mtu] %}
           {% for network in nodeset_networks %}
           {{ mtu_list.append(lookup('vars', networks_lower[network] ~ '_mtu')) }}
           {%- endfor %}
           {% set min_viable_mtu = mtu_list | max %}
           interfaces:
           - name: enp1s0
             type: ethernet
             state: up
             ipv4:
               enabled: true
               dhcp: true
               auto-dns: false
               auto-routes: true
               auto-gateway: true
             ipv6:
               enabled: false
           - name: enp2s0
             type: ethernet
             state: up
             mtu: {{ ctlplane_mtu }}
             ipv4:
               enabled: true
               dhcp: false
               address:
               - ip: {{ ctlplane_ip }}
                 prefix-length: {{ ctlplane_cidr }}
             ipv6:
               enabled: false
           - name: enp3s0
             type: ethernet
             state: up
             mtu: {{ internalapi_mtu }}
             ipv4:
               enabled: true
               dhcp: false
               address:
               - ip: {{ internalapi_ip }}
                 prefix-length: {{ internalapi_cidr }}
             ipv6:
               enabled: false
           - name: enp4s0
             type: ethernet
             state: up
             mtu: {{ min_viable_mtu }}
             ipv4:
               enabled: true
               dhcp: false
               address:
               - ip: {{ storage_ip }}
                 prefix-length: {{ storage_cidr }}
             ipv6:
               enabled: false
           - name: enp5s0
             type: ethernet
             state: up
             mtu: {{ tenant_mtu }}
             ipv4:
               enabled: true
               dhcp: false
               address:
               - ip: {{ tenant_ip }}
                 prefix-length: {{ tenant_cidr }}
             ipv6:
               enabled: false
           - name: enp7s0
             type: ethernet
             state: up
             mtu: 1500
             ipv4:
               enabled: false
             ipv6:
               enabled: false
           - name: br-ex
             type: ovs-bridge
             state: up
             bridge:
               options:
                 stp: false
               port:
               - name: enp7s0
               - name: br-ex
           - name: br-ex
             type: ovs-interface
             state: up
             mtu: 1500
             ipv4:
               enabled: false
             ipv6:
               enabled: false
           dns-resolver:
             config:
               # Both variables may arrive as a string or as a list depending on
               # the NetConfig, and nmstate rejects a nested sequence with
               # "dns-resolver.config.search[0]: invalid type: sequence,
               # expected a string". Normalise both to a flat list.
               search: {{ [dns_search_domains] | flatten }}
               server: {{ ctlplane_dns_nameservers if ctlplane_dns_nameservers is sequence and ctlplane_dns_nameservers is not string else [ctlplane_dns_nameservers] }}
           # The lab defines no host routes (all *_host_routes are empty). If you
           # add any, express them here as an nmstate "routes: config:" list, not
           # as the os-net-config per-interface "routes:" key.
         edpm_network_config_hide_sensitive_logs: false
          #
          # These vars are for the network config templates themselves and are
          # considered EDPM network defaults (for all computes).
         neutron_physical_bridge_name: br-ex
         edpm_ovn_bridge_mappings: ["datacentre:br-ex"]
         ctlplane_host_routes: []
         ctlplane_subnet_cidr: 24
         dns_search_domains: sandbox-UUID-ocp4-cluster.svc.cluster.local
         ctlplane_mtu: 1500
         external_mtu: 1500
         external_cidr: '24'
         external_host_routes: []
         internalapi_mtu: 1500
         internalapi_cidr: '24'
         internalapi_host_routes: []
         storage_mtu: 1500
         storage_cidr: '24'
         storage_host_routes: []
         tenant_mtu: 1500
         tenant_cidr: '24'
         tenant_host_routes: []
         # name of the first network interface on the compute node:
         neutron_public_interface_name: enp1s0
         # edpm_nodes_validation
         edpm_nodes_validation_validate_controllers_icmp: false
         edpm_nodes_validation_validate_gateway_icmp: false
         gather_facts: false
         enable_debug: false
         edpm_bootstrap_release_version_package: []
         # The role default, minus openstack-selinux: that one lives in the RHOSO
         # repository, which does not exist for the 19.0 beta, and download-cache
         # fails with "No package openstack-selinux available". Everything else
         # here is real and available from the RHEL 10 repos, so do not empty the
         # whole list: dropping ksmtuned alone makes bootstrap fail later with
         # "Could not find the requested service ksm.service". Put
         # openstack-selinux back once the RHOSO 19.0 repository is reachable -
         # it carries the OpenStack SELinux policy and is not optional for a real
         # deployment (see OSPRH-39038, OSPRH-39007).
         edpm_bootstrap_packages_bootstrap:
             - driverctl
             - lvm2
             - jq
             - nftables
             - NetworkManager
             - python3-libselinux
             - python3-pyyaml
             - rsync
             - tmpwatch
             - sysstat
             - iproute-tc
             - ksmtuned
             - systemd-container
             - crypto-policies-scripts
             - grubby
             - sos
         # SELinux state applied by the bootstrap service (one of: disabled,
         # enforcing, permissive). "permissive" takes effect immediately and keeps
         # logging AVC denials; "disabled" only edits /etc/selinux/config and needs
         # a reboot. Set back to "enforcing" before treating a run as representative.
         edpm_bootstrap_selinux_mode: permissive
         # Mirror the pre-GA images on the EDPM nodes. The cluster IDMS only rewrites
         # pulls made by CRI-O on the OpenShift nodes; EDPM hosts run podman and resolve
         # registry.redhat.io themselves. edpm-ansible renders this to
         # /etc/containers/registries.conf.d/20-edpm-podman-registries.conf
         edpm_podman_registries:
         - prefix: registry.redhat.io/rhoso/openstack-aodh-api-rhel10
